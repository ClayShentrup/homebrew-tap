name: update casks
# Checks each amp's latest GitHub release once a day (or on demand) and moves its cask to it.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump casks to the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bump() {  # cask-file repo asset
            local cask="Casks/$1.rb" repo="$2" asset="$3"
            local tag; tag=$(gh release view -R "$repo" --json tagName -q .tagName)
            local ver="${tag#v}"
            grep -q "version \"$ver\"" "$cask" && { echo "$1 is current ($ver)"; return; }
            gh release download "$tag" -R "$repo" -p "$asset" -D /tmp/dl --clobber
            local sum; sum=$(sha256sum "/tmp/dl/$asset" | cut -d' ' -f1)
            sed -i -E "s/version \"[^\"]+\"/version \"$ver\"/; s/sha256 \"[0-9a-f]+\"/sha256 \"$sum\"/" "$cask"
            echo "$1 -> $ver"
          }
          bump hanwell ClayShentrup/hanwell Hanwell.pkg
          bump kintsugi ClayShentrup/kintsugi Kintsugi.pkg
          bump unterholz-uh20 ClayShentrup/unterholz-uh20 Unterholz-UH-20.pkg
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update casks to the latest releases"
            git push
          fi
